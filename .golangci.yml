---
# GolangCI-Lint v2 configuration for Tero CLI
# Strict but pragmatic - catches real bugs, ignores noise

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Core static analysis (essential)
    - errcheck # Unchecked errors
    - govet # Standard vet checks
    - staticcheck # Advanced static analysis
    - unused # Unused code
    - ineffassign # Ineffectual assignments

    # Code quality
    - misspell # Common misspellings
    - unconvert # Unnecessary type conversions
    - wastedassign # Wasted assignments

    # Bug detection
    - bodyclose # HTTP response body not closed
    - noctx # HTTP requests without context
    - rowserrcheck # SQL rows.Err() not checked
    - copyloopvar # Loop variable copying

    # Error handling
    - errorlint # Error wrapping issues (use errors.Is)
    - errname # Error naming conventions

    # Type safety
    - forcetypeassert # Unchecked type assertions can panic

    # Additional checks
    - nilerr # Returns nil even when error is not nil
    - nolintlint # Validates nolint directives
    - usestdlibvars # Use stdlib constants

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # Noisy, minimal impact
        - shadow # Overly strict

    staticcheck:
      checks: ["all"]

    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    # Presets for common false positives
    presets:
      - comments
      - std-error-handling

    rules:
      # Skip generated files
      - path: 'pkg/client/generated\.go$'
        linters: [all]

      # Client wrappers match API naming (ApiKey not APIKey) - matches generated types
      - path: "pkg/client/"
        text: "ST1003"
        linters: [staticcheck]

      # API test mocks match the client interface naming
      - path: "internal/api/apitest/"
        text: "ST1003"
        linters: [staticcheck]

      # Allow unused ctx/logger parameters in interface implementations
      - text: "`(ctx|logger)` is unused"
        linters: [unused]

severity:
  default: error

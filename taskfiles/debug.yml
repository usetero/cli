version: "3"

vars:
  DEBUG_ENV: '{{.DEBUG_ENV | default "dev"}}'
  ENV_PREFIX:
    sh: |
      if [ "{{.DEBUG_ENV}}" = "local" ]; then
        echo ""
      else
        echo "doppler run -c {{.DEBUG_ENV}} --"
      fi

tasks:
  list:
    desc: List debug workflows
    cmds:
      - |
        echo "Debug workflows (default DEBUG_ENV=dev):"
        echo "  task debug:ui:run"
        echo "  task debug:ui:logs:slow"
        echo "  task debug:ui:logs:all"
        echo "  task debug:ui:smoke"
        echo "  task debug:onboarding:trace"
        echo "  task debug:sync:trace"
        echo "  task debug:sync:health"
        echo "  task debug:sync:capture"
        echo "  task debug:sync:sanitize-fixture"
        echo "  task debug:data:snapshot"
        echo ""
        echo "To target prd explicitly (discouraged):"
        echo "  task debug:ui:logs:slow DEBUG_ENV=prd ALLOW_PRD=1"

  guard:non-prd:
    internal: true
    cmds:
      - |
        if [ "{{.DEBUG_ENV}}" = "prd" ] && [ "{{.ALLOW_PRD}}" != "1" ]; then
          echo "Refusing to run debug workflow against prd without explicit override."
          echo "Set ALLOW_PRD=1 if you intentionally need prd."
          exit 1
        fi

  ui:run:
    desc: Run Tero in debug mode (defaults to TERO_ENV=dev)
    deps: [guard:non-prd]
    cmds:
      - "{{.ENV_PREFIX}} go run ./cmd/tero {{.CLI_ARGS}}"

  ui:smoke:
    desc: Fast UI safety suite for app/update/render paths
    deps: [guard:non-prd]
    cmds:
      - go test ./internal/app/... ./internal/app/statusbar/...

  ui:logs:slow:
    desc: Tail slow UI logs (slow app update/render) for selected env
    deps: [guard:non-prd]
    cmds:
      - |
        LOG_FILE="$HOME/.tero/environments/{{.DEBUG_ENV}}/tero.log"
        echo "Tailing slow UI logs from $LOG_FILE"
        tail -n 200 -f "$LOG_FILE" | rg --line-buffered "slow app update|slow app render|SESSION START"

  ui:logs:all:
    desc: Tail full app logs for selected env
    deps: [guard:non-prd]
    cmds:
      - |
        LOG_FILE="$HOME/.tero/environments/{{.DEBUG_ENV}}/tero.log"
        echo "Tailing app logs from $LOG_FILE"
        tail -n 200 -f "$LOG_FILE"

  onboarding:trace:
    desc: Tail onboarding gate transitions and runtime init logs
    deps: [guard:non-prd]
    cmds:
      - |
        LOG_FILE="$HOME/.tero/environments/{{.DEBUG_ENV}}/tero.log"
        echo "Tailing onboarding trace from $LOG_FILE"
        tail -n 200 -f "$LOG_FILE" | rg --line-buffered "onboarding gate transition|preflight|runtime initialized|datadog|workspace|sync completed|onboarding complete|slow app update|slow app render|SESSION START"

  sync:trace:
    desc: Tail syncer/uploader activity with slow-loop context
    deps: [guard:non-prd]
    cmds:
      - |
        LOG_FILE="$HOME/.tero/environments/{{.DEBUG_ENV}}/tero.log"
        echo "Tailing sync trace from $LOG_FILE"
        tail -n 300 -f "$LOG_FILE" | rg --line-buffered "scope=powersync|scope=app/upload|sync progress|sync complete|transient error|slow app update|slow app render|SESSION START"

  sync:health:
    desc: Show recent sync/uploader health snapshot from logs
    deps: [guard:non-prd]
    cmds:
      - |
        LOG_FILE="$HOME/.tero/environments/{{.DEBUG_ENV}}/tero.log"
        if [ ! -f "$LOG_FILE" ]; then
          echo "No log file found at $LOG_FILE"
          exit 1
        fi
        echo "Recent sync health ($LOG_FILE):"
        echo ""
        echo "Latest sync + upload lines:"
        tail -n 800 "$LOG_FILE" | rg "scope=powersync|scope=app/upload|sync complete|transient error|upload loop started|completed batch" | tail -n 40 || true
        echo ""
        echo "Latest slow-loop lines:"
        tail -n 800 "$LOG_FILE" | rg "slow app update|slow app render" | tail -n 20 || true
        echo ""
        echo "Latest error lines:"
        tail -n 800 "$LOG_FILE" | rg " level=ERROR " | tail -n 20 || true

  sync:capture:
    desc: Capture raw PowerSync NDJSON stream fixture (default DEBUG_ENV=dev)
    deps: [guard:non-prd]
    vars:
      OUTPUT: '{{.OUTPUT | default "fixtures/powersync/capture.ndjson"}}'
      DURATION: '{{.DURATION | default "90s"}}'
      MAX_BYTES: '{{.MAX_BYTES | default "26214400"}}'
    cmds:
      - |
        CMD="{{.ENV_PREFIX}} go run ./cmd/tero internal powersync capture --output {{.OUTPUT}} --duration {{.DURATION}} --max-bytes {{.MAX_BYTES}}"
        if [ -n "{{.ACCOUNT_ID}}" ]; then
          CMD="$CMD --account-id {{.ACCOUNT_ID}}"
        fi
        eval "$CMD"

  sync:sanitize-fixture:
    desc: Sanitize captured PowerSync fixture to commit-safe NDJSON
    deps: [guard:non-prd]
    cmds:
      - |
        if [ -z "{{.INPUT}}" ] || [ -z "{{.OUTPUT}}" ]; then
          echo "INPUT and OUTPUT are required"
          exit 1
        fi
        CMD="{{.ENV_PREFIX}} go run ./cmd/tero internal powersync sanitize-fixture --input {{.INPUT}} --output {{.OUTPUT}}"
        if [ -n "{{.MAX_LINES}}" ]; then
          CMD="$CMD --max-lines {{.MAX_LINES}}"
        fi
        eval "$CMD"

  data:snapshot:
    desc: Show local SQLite snapshot (counts + pending upload rows)
    deps: [guard:non-prd]
    cmds:
      - |
        if ! command -v sqlite3 >/dev/null 2>&1; then
          echo "sqlite3 not installed; install sqlite3 to use debug:data:snapshot"
          exit 1
        fi
        DB_PATH=$(find "$HOME/.tero/environments/{{.DEBUG_ENV}}/orgs" -type f -name "*.sqlite" 2>/dev/null | head -n 1)
        if [ -z "$DB_PATH" ]; then
          echo "No SQLite database found under ~/.tero/environments/{{.DEBUG_ENV}}/orgs"
          exit 1
        fi
        echo "SQLite snapshot: $DB_PATH"
        echo ""
        sqlite3 "$DB_PATH" <<'SQL'
        .mode column
        .headers on
        SELECT 'services' AS table_name, COUNT(*) AS row_count FROM services
        UNION ALL
        SELECT 'log_event_statuses', COUNT(*) FROM log_event_statuses
        UNION ALL
        SELECT 'messages', COUNT(*) FROM messages
        UNION ALL
        SELECT 'conversations', COUNT(*) FROM conversations
        UNION ALL
        SELECT 'ps_crud_pending', COUNT(*) FROM ps_crud;
        SQL

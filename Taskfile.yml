version: "3"

vars:
  CPU_COUNT:
    sh: nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "4"
  PARALLEL_COUNT:
    sh: echo $(({{.CPU_COUNT}} * 2))

tasks:
  # ===========================================================================
  # Primary workflows (what you'll use most)
  # ===========================================================================

  do:
    desc: Format, lint, and test (pre-commit check)
    cmds:
      - task: fmt
      - task: lint
      - task: test

  signoff:
    desc: Full validation before push
    aliases: [sign, s]
    deps: [do, check, build]
    cmds:
      - gh signoff

  dev:
    desc: Generate code and build
    deps: [generate]
    cmds:
      - task: build

  # ===========================================================================
  # Code generation
  # ===========================================================================

  generate:
    desc: Generate all code (GraphQL client + SQLite schema)
    cmds:
      - task: generate:client
      - task: generate:schema

  generate:client:
    desc: Generate GraphQL client (requires control plane at localhost:8081)
    dir: internal/api/gen
    cmds:
      - npx get-graphql-schema http://localhost:8081/graphql > schema.graphql
      - go run github.com/Khan/genqlient

  generate:schema:
    desc: Generate PowerSync and SQLite schema (uses local control plane)
    cmds:
      - go generate ./internal/powersync
      - go generate ./internal/sqlite
      - sed '/^-- Auto-generated/d; /^-- Run .task generate/d' ../control-plane/internal/powersync/schema.sql > internal/chat/tools/query_schema.sql

  # ===========================================================================
  # Build
  # ===========================================================================

  build:
    desc: Build the tero binary
    cmds:
      - go build -o tero cmd/tero/main.go
    sources:
      - "**/*.go"
    generates:
      - tero

  build:version:
    desc: Build with version info (same as CI)
    cmds:
      - |
        VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
        go build -ldflags "-X main.version=${VERSION}" -o tero cmd/tero/main.go
        echo "Built tero ${VERSION}"

  install:
    desc: Install tero to GOPATH
    deps: [build]
    cmds:
      - go install cmd/tero/main.go

  # ===========================================================================
  # Quality checks
  # ===========================================================================

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  lint:
    desc: Run all linters
    deps: [lint:go, lint:scripts]

  lint:go:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  lint:scripts:
    desc: Lint shell scripts with shellcheck
    cmds:
      - shellcheck scripts/*.sh

  check:
    desc: Validate release configuration
    cmds:
      - goreleaser check

  # ===========================================================================
  # Testing
  # ===========================================================================

  test:
    desc: Run unit tests
    cmds:
      - gotestsum --format short-verbose -- -race -p {{.CPU_COUNT}} -parallel {{.PARALLEL_COUNT}} -skip "^TestIntegration_|^TestCorrectness_" ./...

  test:integration:
    desc: Run integration tests (requires doppler)
    cmds:
      - doppler run -- gotestsum --format short-verbose -- -race -tags=integration -run "^TestIntegration_" ./...

  test:correctness:
    desc: Run correctness tests (requires doppler)
    cmds:
      - doppler run -- gotestsum --format short-verbose -- -v -tags=correctness -run "^TestCorrectness_" ./...

  test:all:
    desc: Run all tests (unit + integration)
    cmds:
      - task: test
      - task: test:integration

  # ===========================================================================
  # Development helpers
  # ===========================================================================

  run:
    desc: Run tero without building
    cmds:
      - go run ./cmd/tero {{.CLI_ARGS}}

  auth:login:
    desc: Login to Tero (dev)
    cmds:
      - doppler run -- go run ./cmd/tero auth login

  auth:token:
    desc: Print current access token
    cmds:
      - doppler run -- go run ./cmd/tero auth token

  auth:status:
    desc: Show auth status
    cmds:
      - doppler run -- go run ./cmd/tero auth status

  # ===========================================================================
  # Admin (internal tooling, not shipped)
  # ===========================================================================

  admin:join-org:
    desc: Join a client organization (for support/debugging)
    cmds:
      - doppler run -- go run ./cmd/admin join-org {{.CLI_ARGS}}

  admin:leave-org:
    desc: Leave a client organization
    cmds:
      - doppler run -- go run ./cmd/admin leave-org {{.CLI_ARGS}}

  # ===========================================================================
  # Dependencies
  # ===========================================================================

  update:powersync:
    desc: Update PowerSync SQLite extension to latest release
    cmds:
      - ./scripts/update-powersync.sh {{.CLI_ARGS}}

  # ===========================================================================
  # Cleanup
  # ===========================================================================

  clean:
    desc: Clean build artifacts and caches
    cmds:
      - rm -f tero
      - rm -rf dist/
      - go clean -cache -testcache -modcache
      - echo "Cleaned build artifacts and Go caches"

  reset:
    desc: Reset dev environment (auth, config, database, logs)
    cmds:
      - go run ./cmd/tero reset --db
      - rm -f /tmp/tero.log
      - echo "Reset complete"

  # ===========================================================================
  # Release
  # ===========================================================================

  release:check:
    desc: Check commits follow conventional format
    cmds:
      - |
        echo "Recent commits (should follow conventional commit format):"
        git log --oneline -10
        echo ""
        echo "Valid prefixes: feat, fix, chore, docs, refactor, test, ci, perf, revert"

  release:snapshot:
    desc: Test release build locally
    cmds:
      - goreleaser release --snapshot --clean --skip=publish
      - echo ""
      - ls -lh dist/*.tar.gz dist/*.zip 2>/dev/null || true

  release:test-install:
    desc: Test install.sh script against latest release
    cmds:
      - |
        echo "Testing install script..."
        export TERO_INSTALL_DIR="/tmp/tero-install-test"
        rm -rf "$TERO_INSTALL_DIR"
        sh scripts/install.sh --help
        echo ""
        echo "Installing latest release to $TERO_INSTALL_DIR..."
        sh scripts/install.sh -y
        if [ -x "$TERO_INSTALL_DIR/tero" ]; then
          echo ""
          echo "Installation successful!"
          "$TERO_INSTALL_DIR/tero" --version
        else
          echo "Installation failed"
          exit 1
        fi
        rm -rf "$TERO_INSTALL_DIR"

name: PR CI

on:
  pull_request:
    branches: [master]
  merge_group:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/_go-checks.yaml
    secrets: inherit

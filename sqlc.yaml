version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/infrastructure/sqlite/schema.sql"
    queries: "internal/runtime/onboarding/db/queries.sql"
    gen:
      go:
        package: "onboardingdb"
        out: "internal/runtime/onboarding/db/gen"
        emit_pointers_for_null_types: true
        emit_interface: true

  - engine: "sqlite"
    schema: "internal/infrastructure/sqlite/schema.sql"
    queries: "internal/domains/chat/db/conversations.sql"
    gen:
      go:
        package: "conversationsdb"
        out: "internal/domains/chat/db/conversationsgen"
        emit_pointers_for_null_types: true
        emit_interface: true

  - engine: "sqlite"
    schema: "internal/infrastructure/sqlite/schema.sql"
    queries: "internal/domains/chat/db/messages.sql"
    gen:
      go:
        package: "messagesdb"
        out: "internal/domains/chat/db/messagesgen"
        emit_pointers_for_null_types: true
        emit_interface: true

  - engine: "sqlite"
    schema: "internal/infrastructure/sqlite/schema.sql"
    queries: "internal/domains/tenancy/db/accounts.sql"
    gen:
      go:
        package: "accountsdb"
        out: "internal/domains/tenancy/db/accountsgen"
        emit_pointers_for_null_types: true
        emit_interface: true

  - engine: "sqlite"
    schema: "internal/infrastructure/sqlite/schema.sql"
    queries: "internal/domains/tenancy/db/workspaces.sql"
    gen:
      go:
        package: "workspacesdb"
        out: "internal/domains/tenancy/db/workspacesgen"

version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/sqlite/queries/"
    schema: "internal/sqlite/schema.sql"
    gen:
      go:
        package: "gen"
        out: "internal/sqlite/gen"
        emit_pointers_for_null_types: true
        emit_interface: true
        output_db_file_name: "db.go"
        output_models_file_name: "models.go"

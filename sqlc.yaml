  - engine: "sqlite"
    schema: "internal/infrastructure/sqlite/schema.sql"
    queries: "internal/domains/status/db/queries.sql"
    gen:
      go:
        package: "statusdb"
        out: "internal/domains/status/db/gen"
        emit_pointers_for_null_types: true
        emit_interface: true

type Finding {
  """Unique identifier"""
  id: ID!

  """
  Service this finding belongs to. Finding memberships must not span services.
  """
  serviceID: ID!

  """
  Product domain that owns this finding. Values: cost = Cost optimization
  findings that identify telemetry spend with weak value or misplaced volume.;
  compliance = Compliance findings that identify sensitive or regulated data exposure.
  """
  checkDomain: FindingCheckDomain!

  """
  Specific finding category raised within its owning domain. Values:
  routine_system_chatter = Routine system chatter with low operator prominence
  and weak per-event value.; debug_noise = Production log events whose expected
  severity is debug.; dead_weight = Log events with no meaningful observability
  value.; background_noise = Infrastructure, bot, probe, or other background
  traffic that should not consume production log budget.; commodity_traffic =
  Aggregate operational series where repeated volume adds little per-event
  value.; hot_path = High-volume application-path logging that appears misplaced
  for the execution path.; reactive_flood = Failure or dependency-driven floods
  that materially inflate log volume.; configuration_noise = Repeated
  configuration-related failures that consume production log budget.;
  debug_marker = Developer breadcrumb markers left in production logging.;
  debug_artifacts = Inline debug payloads or object dumps that should live
  outside normal production logs.; secret_exposure = Log events that expose
  secrets, credentials, or authentication material.; payment_data_exposure = Log
  events that expose payment instrument or payment-processing data.;
  pii_exposure = Log events that expose meaningful customer or end-user identity
  data.; phi_exposure = Log events that expose health or treatment-related personal data.
  """
  checkType: FindingCheckType!

  """Version of the check logic that most recently reconciled this finding."""
  checkVersion: Int!

  """
  Current workflow state for this finding. Values: pending = Finding is open and
  waiting for investigation.; suppressed = Finding was investigated and
  intentionally suppressed.; escalated = Finding was investigated and escalated
  into an issue.; closed = Finding no longer matches the current world.
  """
  status: FindingStatus!

  """
  When this finding stopped matching the current world. Null while active.
  """
  closedAt: Time

  """When this finding row was created."""
  createdAt: Time!

  """When this finding row was last updated."""
  updatedAt: Time!

  """Typed finding details for the finding's check type."""
  details: FindingDetails!
}


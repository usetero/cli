type Issue {
  """Unique identifier"""
  id: ID!

  """
  Denormalized for tenant isolation. Auto-set via trigger from finding.account_id.
  """
  accountID: UUID!

  """The finding this issue belongs to"""
  findingID: ID!

  """
  Denormalized service subject. Auto-set via trigger from finding.service_id.
  """
  serviceID: UUID!

  """
  How much attention a kept finding deserves. Values: low = Legitimate finding,
  but low urgency or prominence.; medium = Legitimate finding with clear but not
  top-tier urgency.; high = Legitimate finding that deserves strong user attention.
  """
  priority: IssuePriority!

  """Short user-facing title for this issue."""
  title: String!

  """User-facing explanation of this issue."""
  summary: String!

  """
  Optional grounded hypothesis about the likely underlying cause of this issue.
  """
  causeHypothesis: String

  """When this issue episode ended. Null while this issue is still active."""
  closedAt: Time

  """
  When this issue was intentionally ignored by a user. Null while still active.
  """
  ignoredAt: Time

  """When this issue row was created."""
  createdAt: Time!

  """When this issue row was last updated."""
  updatedAt: Time!

  """The finding this issue episode belongs to"""
  finding: Finding!

  """Chosen actions owned by this issue."""
  issueActions(after: Cursor, first: Int, before: Cursor, last: Int, orderBy: IssueActionOrder, where: IssueActionWhereInput): IssueActionConnection!

  """Log event policies created for this issue."""
  logEventPolicies(after: Cursor, first: Int, before: Cursor, last: Int, orderBy: LogEventPolicyOrder, where: LogEventPolicyWhereInput): LogEventPolicyConnection!

  """Datadog log exclusion filters created for this issue."""
  datadogLogExclusionFilters(after: Cursor, first: Int, before: Cursor, last: Int, orderBy: DatadogLogExclusionFilterOrder, where: DatadogLogExclusionFilterWhereInput): DatadogLogExclusionFilterConnection!

  """
  Stable account-local issue identifier for product links and support workflows.
  """
  displayID: String!

  """Account-qualified issue identifier for cross-account presentation."""
  qualifiedDisplayID: String!

  """Product check that produced this issue's finding."""
  check: Check!
  state: IssueState!
  logEvents: [LogEvent!]!
  service: Service
  actionable: Boolean!
  cost: StatusMeasurementTotals!

  """Frozen issue cost remaining after applying preview remediation."""
  projectedCost: StatusMeasurementTotals!

  """Bucketed issue cost over a half-open range."""
  costTrend(input: IssueCostTrendInput!): IssueCostTrendSeries!
  savings: StatusMeasurementTotals!
  logEventPolicyProposals: [LogEventPolicyProposal!]!

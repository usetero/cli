"""Dimension to group fleet rows by."""
enum EdgeFleetGroupBy {
  SERVICE
  NAMESPACE
  VERSION
}

"""
One row per distinct value of the chosen groupBy dimension. Null key means the
instance had no value for that field.
"""
type EdgeFleetGroupRow {
  key: String
  instanceCount: Int!
  connectedInstanceCount: Int!
  totalHits: Int!
  totalMisses: Int!
  totalErrors: Int!
  latestSyncAt: Time
}

"""One point of aggregated counters in a policy time series."""
type EdgeFleetPolicyPoint {
  start: Time!
  end: Time!
  hits: Int!
  misses: Int!
  errors: Int!
}

"""
A policy time series for the filtered fleet, or a synthetic "Other" rollup of
non-top-K policies when policyId is null.
"""
type EdgeFleetPolicySeries {
  """Null for the synthetic "Other" rollup row."""
  policyId: ID
  logEventName: String!
  serviceName: String
  totalHits: Int!
  totalMisses: Int!
  totalErrors: Int!
  series: [EdgeFleetPolicyPoint!]!
}

"""Fleet-wide aggregated telemetry across edge instances."""
type EdgeFleetTelemetry {
  range: TimeRange!
  granularity: TimeGranularity!
  instanceCount: Int!
  connectedInstanceCount: Int!
  totalHits: Int!
  totalMisses: Int!
  totalErrors: Int!

  """
  Top-K policies ordered by totalHits desc. When fewer than topK policies exist,
  contains them all and otherPolicies is null.
  """
  topPolicies: [EdgeFleetPolicySeries!]!

  """
  Synthetic rollup of non-top policies when topK truncated the set; null otherwise.
  """
  otherPolicies: EdgeFleetPolicySeries

  """
  One row per distinct value of the groupBy dimension, sorted by instanceCount
  desc then key asc.
  """
  groups: [EdgeFleetGroupRow!]!
}

"""Input for aggregated edge fleet telemetry."""
input EdgeFleetTelemetryInput {
  where: EdgeFleetTelemetryWhere
  range: TimeRangeInput!
  granularity: TimeGranularity!
  groupBy: EdgeFleetGroupBy!

  """
  Maximum number of policy series to return. Defaults to 10 and server caps
  at 100.
  """
  topK: Int = 10

  """
  Threshold for connectedInstanceCount: instances with lastSyncAt >= now() - connectedWithin.
  """
  connectedWithin: Duration!

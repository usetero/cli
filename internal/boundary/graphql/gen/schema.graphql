  lastSeenAt: Time

  """
  First inventory refresh where this previously observed filter was absent from Datadog.
  """
  removedAt: Time

  """Stable hash of the remote Datadog filter configuration."""
  remoteConfigHash: String

  """
  Import workflow state for this Datadog log exclusion filter. Values:
  not_evaluated = Filter has not been evaluated for Tero policy import.;
  unsupported = Filter cannot currently be imported as Tero policies.;
  proposal_ready = Filter has Tero policy proposals ready.; sample_key_required
  = Filter needs a sample key before Tero policy import.; policy_active =
  Imported Tero policies are active.; policy_verified = Imported Tero policies

query ListOrganizations {
    organizations {
        edges {
            node {
                id
                name
                createdAt
                workosOrganizationID
            }
        }
        totalCount
    }
}

mutation CreateOrganizationAndBootstrap($input: OrganizationCreateInput!) {
    createOrganizationAndBootstrap(input: $input) {
        organization {
            id
            name
            createdAt
            workosOrganizationID
        }
        account {
            id
            name
        }
    }
}

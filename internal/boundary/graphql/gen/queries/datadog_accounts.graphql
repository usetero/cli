query GetAccount($id: ID!) {
    accounts(where: { id: $id }, first: 1) {
        edges {
            node {
                id
                datadogAccount {
                    id
                    name
                    site
                }
            }
        }
    }
}

mutation CreateDatadogAccountWithCredentials(
    $input: CreateDatadogAccountWithCredentialsInput!
) {
    createDatadogAccount(input: $input) {
        id
        name
        site
        createdAt
        updatedAt
    }
}

mutation ValidateDatadogApiKey($input: ValidateDatadogApiKeyInput!) {
    validateDatadogApiKey(input: $input) {
        valid
        error
    }
}

query GetDatadogAccountStatus($id: ID!) {
    datadogAccounts(where: { id: $id }, first: 1) {
        edges {
            node {
                id
                status {
                    health
                    readyForUse
                    logEventCount
                    logEventAnalyzedCount
                    logServiceCount
                    logActiveServices
                    disabledServices
                    inactiveServices
                    okServices
                    pendingRecommendationCount
                    approvedRecommendationCount
                    dismissedRecommendationCount
                }
            }
        }
    }
}

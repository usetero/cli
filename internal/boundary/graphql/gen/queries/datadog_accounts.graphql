query GetAccount($id: ID!) {
    accounts(where: { id: $id }, first: 1) {
        edges {
            node {
                id
                datadogAccount {
                    id
                    name
                    site
                }
            }
        }
    }
}

mutation CreateDatadogAccountWithCredentials(
    $input: DatadogAccountCreateInput!
) {
    createDatadogAccount(input: $input) {
        id
        name
        site
        createdAt
        updatedAt
    }
}

mutation ValidateDatadogApiKey($input: ValidateDatadogApiKeyInput!) {
    validateDatadogApiKey(input: $input) {
        valid
        error
    }
}

query GetDatadogAccountStatus($id: ID!) {
    datadogAccounts(where: { id: $id }, first: 1) {
        edges {
            node {
                id
                status {
                    health
                    readiness {
                        readyForUse
                    }
                    coverage {
                        logEventCount
                        logEventAnalyzedCount
                        logServiceCount
                        logActiveServices
                        disabledServices
                        inactiveServices
                        okServices
                    }
                }
            }
        }
    }
}

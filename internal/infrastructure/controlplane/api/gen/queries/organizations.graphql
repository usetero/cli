query ListOrganizations {
    organizations {
        edges {
            node {
                id
                name
                createdAt
                workosOrganizationID
            }
        }
        totalCount
    }
}

mutation CreateOrganizationAndBootstrap($input: CreateOrganizationInput!) {
    createOrganizationAndBootstrap(input: $input) {
        organization {
            id
            name
            createdAt
            workosOrganizationID
        }
        account {
            id
            name
        }
        workspace {
            id
            name
        }
    }
}

mutation DeleteOrganization($id: ID!, $confirmation: String!) {
    deleteOrganization(id: $id, confirmation: $confirmation)
}

query ListWorkspaces($accountID: ID!) {
    workspaces(where: { accountID: $accountID }) {
        edges {
            node {
                id
                name
                purpose
                createdAt
            }
        }
        totalCount
    }
}

mutation DeleteWorkspace($id: ID!, $confirmation: String!) {
    deleteWorkspace(id: $id, confirmation: $confirmation)
}

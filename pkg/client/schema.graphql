  """The Datadog account performing discovery"""
  datadogAccountId: ID!

  """
  Status: DISABLED > INACTIVE > BROKEN > STALE > DISCOVERING > ANALYZING > READY
  """
  logStatus: ServiceStatusLogStatus!

  """Total service log volume in the rolling 7-day window"""
  logServiceVolumeInWindow: Int

  """Total discovered log event volume in the rolling 7-day window"""
  logDiscoveredVolumeInWindow: Int

  """Coverage percentage (discovered_volume / service_volume * 100)"""
  logPercentComplete: Float

  """Total number of log events discovered for this service"""
  logEventCount: Int!

  """Number of log events with SAVED status"""
  logSavedCount: Int!

  """Number of log events with VALUABLE status"""
  logValuableCount: Int!

  """Number of log events with WASTE status"""
  logWasteCount: Int!

  """Number of log events with ANALYZING status"""
  logAnalyzingCount: Int!

  """Number of log events with DISCOVERING status"""
  logDiscoveringCount: Int!

  """
  Total events/hour before first policy approval (sum across SAVED log events)
  """
  logVolumePerHourBefore: Float

  """Total events/hour in recent window (sum across SAVED log events)"""
  logVolumePerHourAfter: Float

  """
  Total bytes/hour before first policy approval (sum across SAVED log events)
  """
  logBytesPerHourBefore: Float

  """Total bytes/hour in recent window (sum across SAVED log events)"""
  logBytesPerHourAfter: Float

  """Error message if log_status is BROKEN"""
  logError: String

  """When the error occurred"""
  logErrorAt: Time

  """
  Warning message (e.g., rate limit) - informational, does not affect status
  """
  logWarning: String

  """When the warning occurred"""
  logWarningAt: Time
}

"""
Status: DISABLED > INACTIVE > BROKEN > STALE > DISCOVERING > ANALYZING > READY
"""
enum ServiceStatusLogStatus {
  """Discovery is turned off for this service (enabled = false)"""
  DISABLED

  """Service exists but has zero log volume in the time window"""
  INACTIVE

  """Discovery is failing repeatedly (5+ consecutive errors)"""
  BROKEN

  """Volume data exists but is older than 48 hours"""
  STALE

  """Discovery is enabled but no volume data exists yet"""
  DISCOVERING
  ANALYZING

  """Fresh volume data with 90%+ coverage - fully discovered"""
  READY
}


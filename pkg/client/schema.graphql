"""
View that provides status for each Datadog account based on service statuses
"""
type DatadogAccountStatus {
  """The Datadog account this status belongs to"""
  datadogAccountId: ID!

  """Account ID (denormalized from Datadog account)"""
  accountId: ID!

  """
  Status: DISABLED > INACTIVE > BROKEN > STALE > DISCOVERING > ANALYZING > READY
  """
  logStatus: DatadogAccountStatusLogStatus!

  """
  True when account has enough analyzed data for a good user experience (>= 50 analyzed log events)
  """
  readyForUse: Boolean!

  """
  Number of log events that have been analyzed (saved + valuable + waste)
  """
  logAnalyzedCount: Int!

  """
  Total service log volume in the rolling 7-day window across all active services
  """
  logServiceVolumeInWindow: Int

  """
  Total discovered log event volume in the rolling 7-day window across all active services
  """
  logDiscoveredVolumeInWindow: Int

  """Overall coverage percentage"""
  logPercentComplete: Float

  """Total number of services"""
  logServiceCount: Int!

  """Services not DISABLED or INACTIVE"""
  logActiveServices: Int!

  """Services with DISABLED status"""
  logDisabledServices: Int!

  """Services with INACTIVE status"""
  logInactiveServices: Int!

  """Services with BROKEN status"""
  logBrokenServices: Int!

  """Services with STALE status"""
  logStaleServices: Int!

  """Services with DISCOVERING status"""
  logDiscoveringServices: Int!

  """Services with ANALYZING status"""
  logAnalyzingServices: Int!

  """Services with READY status"""
  logReadyServices: Int!

  """Total log events across all services"""
  logEventCount: Int!

  """Log events with SAVED status"""
  logSavedCount: Int!

  """Log events with VALUABLE status"""
  logValuableCount: Int!

  """Log events with WASTE status"""
  logWasteCount: Int!

  """Log events with ANALYZING status"""
  logAnalyzingCount: Int!

  """Log events with DISCOVERING status"""
  logDiscoveringCount: Int!

  """First error message from any broken service"""
  logError: String

  """When the most recent error occurred"""
  logErrorAt: Time

  """Most recent warning message"""
  logWarning: String

  """When the most recent warning occurred"""
  logWarningAt: Time
}

"""
Status: DISABLED > INACTIVE > BROKEN > STALE > DISCOVERING > ANALYZING > READY
"""
enum DatadogAccountStatusLogStatus {
  """All services have discovery turned off"""
  DISABLED

  """All active services have zero log volume"""
  INACTIVE

  """At least one service has discovery errors (5+ consecutive failures)"""
  BROKEN

  """At least one service has stale data (older than 48 hours)"""
  STALE

  """At least one service is still being discovered (no volume data yet)"""
  DISCOVERING
  ANALYZING

  """All services have fresh data with 90%+ coverage"""
  READY
}


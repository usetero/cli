version: 2

before:
  hooks:
    # Ensure dependencies are up to date
    - go mod tidy

builds:
  - id: tero
    main: ./cmd/tero
    binary: tero
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: tero
    name_template: "tero_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
    # format defaults to tar.gz, zip for windows

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

brews:
  - name: tero
    directory: Formula
    repository:
      owner: usetero
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://usetero.com"
    description: "Improve your observability data quality from the terminal"
    license: "Apache-2.0"
    install: |
      bin.install "tero"
    test: |
      system "#{bin}/tero", "--version"

scoops:
  - name: tero
    directory: bucket
    repository:
      owner: usetero
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://usetero.com"
    description: "Improve your observability data quality from the terminal"
    license: "Apache-2.0"

dockers:
  - image_templates:
      - "usetero/tero:{{ .Version }}-amd64"
      - "usetero/tero:latest-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
    dockerfile: Dockerfile
  - image_templates:
      - "usetero/tero:{{ .Version }}-arm64"
      - "usetero/tero:latest-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
    dockerfile: Dockerfile

docker_manifests:
  - name_template: "usetero/tero:{{ .Version }}"
    image_templates:
      - "usetero/tero:{{ .Version }}-amd64"
      - "usetero/tero:{{ .Version }}-arm64"
  - name_template: "usetero/tero:latest"
    image_templates:
      - "usetero/tero:latest-amd64"
      - "usetero/tero:latest-arm64"

release:
  github:
    owner: usetero
    name: cli
  name_template: "v{{.Version}}"
  extra_files:
    - glob: scripts/install.sh
